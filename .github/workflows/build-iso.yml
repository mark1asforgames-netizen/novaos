name: Build NovaOS ISO

# Manual trigger only: GitHub -> Actions -> "Build NovaOS ISO" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the ISO as a Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Build ISO inside a Debian 13 container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD":/src -e OUT=/src/out -e WORK=/build \
            debian:trixie \
            bash -c 'apt-get update && apt-get install -y live-build && bash /src/iso/build.sh'
          sudo chown -R "$USER" out
          ls -la out

      - name: Keep build log (also when the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          if-no-files-found: ignore

      - name: Split ISO if it exceeds the 2 GiB per-file release limit
        run: |
          cd out
          iso="$(ls novaos-*.iso)"
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
            echo "ISO was split into parts; see docs/BUILD_ISO.md for joining on Windows."
          fi
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          gh release create "v${ver}-build${{ github.run_number }}" \
            out/novaos-* out/SHA256SUMS out/build.log \
            --prerelease \
            --title "NovaOS ${ver} (build ${{ github.run_number }})" \
            --notes "Development build. Untested on real hardware. Live login if asked: user 'nova', password 'live'. Verify with SHA256SUMS."
